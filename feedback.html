<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Preparedness - Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, rgba(199, 210, 254, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(147, 51, 234, 0.1), transparent 50%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ✅ NEW HEADER & FOOTER STYLES */
        .site-header {
            background-color: #1e293b; /* slate-800 */
            padding: 15px 20px;
            border-bottom: 1px solid #334155; /* slate-700 */
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #f1f5f9; /* slate-100 */
        }
        .logo-image {
            height: 60px;
            margin-right: 15px;
        }
        .site-name {
            font-size: 1.75em;
            font-weight: 700;
        }
        .profile-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3b82f6; /* blue-500 */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .profile-button:hover {
            background-color: #2563eb; /* blue-600 */
        }
        .site-footer {
            background-color: #0f172a; /* slate-900 */
            color: #94a3b8; /* slate-400 */
            text-align: center;
            padding: 25px 0;
            font-size: 0.9em;
        }

        /* --- Original Page Styles --- */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-out {
            animation: fadeOut 0.5s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white">

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="ResQHub Logo" class="logo-image">
                <span class="site-name">ResQHub</span>
            </a>
            <a href="profile.html" class="profile-button">Profile</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div id="app-container" class="w-full max-w-2xl mx-auto">
            <div id="feedback-form-wrapper" class="p-1 bg-gradient-to-br from-purple-500 to-indigo-500 rounded-3xl shadow-2xl fade-in">
                <div class="bg-slate-800 rounded-2xl p-6 md:p-8">
                    <div class="text-center mb-6">
                        <i class="fas fa-comments text-5xl text-purple-400 mb-3"></i>
                        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">Content Feedback</h1>
                        <p class="text-slate-400 mt-2 text-lg">Help us improve by sharing your suggestions or corrections.</p>
                    </div>
                    <form id="feedback-form" class="space-y-4">
                        <div>
                            <label for="feedback-type" class="block mb-2 text-sm font-medium text-slate-300">Feedback Type</label>
                            <select id="feedback-type" class="bg-slate-700 border border-slate-600 text-white text-base rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-3">
                                <option>Suggestion for new scenario</option>
                                <option>Correction on existing content</option>
                                <option>General Feedback</option>
                            </select>
                        </div>
                        <div>
                            <label for="feedback-message" class="block mb-2 text-sm font-medium text-slate-300">Message</label>
                            <textarea id="feedback-message" rows="4" class="bg-slate-700 border border-slate-600 text-white text-base rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-3 transition-shadow duration-200 shadow-sm focus:shadow-lg focus:shadow-purple-500/20" placeholder="Please be as detailed as possible..."></textarea>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white font-bold py-3 px-10 rounded-lg text-lg transition-all shadow-lg transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Submit Feedback
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <div id="success-popup" class="hidden fixed top-5 right-5 bg-green-600 text-white py-3 px-5 rounded-lg shadow-lg flex items-center gap-3 z-50">
        <i class="fas fa-check-circle text-xl"></i>
        <span class="font-semibold">Feedback Submitted</span>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 ResQHub. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- UI ELEMENTS ---
            const submitBtn = document.getElementById('submit-btn');
            const feedbackForm = document.getElementById('feedback-form');
            const feedbackMessage = document.getElementById('feedback-message');
            const successPopup = document.getElementById('success-popup');

            function showPopup(element, duration = 3000) {
                element.classList.remove('hidden', 'fade-out');
                element.classList.add('fade-in');
                setTimeout(() => {
                    element.classList.remove('fade-in');
                    element.classList.add('fade-out');
                }, duration);
            }

            function updateSubmitButtonState() {
                submitBtn.disabled = feedbackMessage.value.trim() === '';
            }

            feedbackMessage.addEventListener('input', updateSubmitButtonState);

            feedbackForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (feedbackMessage.value.trim() === '') return;

                // 1. Show submission in progress
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

                // Simulate a network delay for the demo
                setTimeout(() => {
                    // 2. Reset the form and show the popup
                    feedbackForm.reset();
                    showPopup(successPopup);

                    // 3. Reset the button
                    submitBtn.innerHTML = 'Submit Feedback';
                    updateSubmitButtonState(); // This will disable the button
                }, 500); // 0.5 second delay
            });
        });
    </script>
</body>
</html>

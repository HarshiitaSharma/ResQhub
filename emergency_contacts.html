<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Preparedness Arcade - Emergency Contacts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-2 sm:p-4 bg-gradient-to-br from-[#0f172a] via-[#1e293b] to-[#0f172a]">

    <div id="app-container" class="w-full max-w-4xl mx-auto">

        <div class="p-1 bg-gradient-to-br from-blue-500 to-emerald-500 rounded-3xl shadow-2xl fade-in">
            <div class="bg-slate-800 rounded-2xl p-4 md:p-5">
                <!-- Header -->
                <div class="text-center mb-4">
                    <i class="fas fa-phone-volume text-3xl text-blue-400 mb-2"></i>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Emergency Contacts</h1>
                    <p class="text-slate-400 mt-1 text-sm md:text-base">Select your region for state-specific numbers.</p>
                </div>

                <!-- Region Selector -->
                <div class="mb-4">
                    <label for="region-select" class="block mb-2 text-xs font-medium text-slate-300">Select Your Region:</label>
                    <select id="region-select" class="bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2">
                        <option selected value="none">Choose a region...</option>
                        <option value="national">National (All India)</option>
                        <option value="andaman_nicobar">Andaman & Nicobar Islands</option>
                        <option value="andhra_pradesh">Andhra Pradesh</option>
                        <option value="arunachal_pradesh">Arunachal Pradesh</option>
                        <option value="assam">Assam</option>
                        <option value="bihar">Bihar</option>
                        <option value="chandigarh">Chandigarh</option>
                        <option value="chhattisgarh">Chhattisgarh</option>
                        <option value="dadra_nagar_haveli_daman_diu">Dadra & Nagar Haveli and Daman & Diu</option>
                        <option value="delhi">Delhi</option>
                        <option value="goa">Goa</option>
                        <option value="gujarat">Gujarat</option>
                        <option value="haryana">Haryana</option>
                        <option value="himachal_pradesh">Himachal Pradesh</option>
                        <option value="jammu_kashmir">Jammu & Kashmir</option>
                        <option value="jharkhand">Jharkhand</option>
                        <option value="karnataka">Karnataka</option>
                        <option value="kerala">Kerala</option>
                        <option value="ladakh">Ladakh</option>
                        <option value="lakshadweep">Lakshadweep</option>
                        <option value="madhya_pradesh">Madhya Pradesh</option>
                        <option value="maharashtra">Maharashtra</option>
                        <option value="manipur">Manipur</option>
                        <option value="meghalaya">Meghalaya</option>
                        <option value="mizoram">Mizoram</option>
                        <option value="nagaland">Nagaland</option>
                        <option value="odisha">Odisha</option>
                        <option value="puducherry">Puducherry</option>
                        <option value="punjab">Punjab</option>
                        <option value="rajasthan">Rajasthan</option>
                        <option value="sikkim">Sikkim</option>
                        <option value="tamil_nadu">Tamil Nadu</option>
                        <option value="telangana">Telangana</option>
                        <option value="tripura">Tripura</option>
                        <option value="uttar_pradesh">Uttar Pradesh</option>
                        <option value="uttarakhand">Uttarakhand</option>
                        <option value="west_bengal">West Bengal</option>
                    </select>
                </div>

                <!-- Contacts Display -->
                <div id="contacts-display" class="space-y-3">
                    
                    <!-- National Helplines -->
                    <div id="national-helplines">
                         <h2 class="text-lg font-bold text-slate-200 border-b-2 border-slate-700 pb-2 mb-2">National Helplines</h2>
                         <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                            <!-- National contacts injected here -->
                         </div>
                    </div>
                   
                    <!-- State Helplines -->
                    <div id="state-helplines" class="hidden">
                        <h2 id="state-title" class="text-lg font-bold text-slate-200 border-b-2 border-slate-700 pb-2 mb-2"></h2>
                        <div id="state-contacts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                           <!-- State contacts injected here -->
                        </div>
                    </div>

                     <!-- Placeholder -->
                     <div id="placeholder" class="text-center py-4 px-4 bg-slate-700/50 rounded-xl">
                        <i id="placeholder-icon" class="fas fa-map-marker-alt text-2xl text-slate-500 mb-2"></i>
                        <p id="placeholder-text" class="text-slate-400 text-xs">Please select a region to view state-specific helplines.</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const contacts = {
            national: [
                { name: "National Disaster Management (NDMA)", number: "1078", icon: "fa-shield-alt" },
                { name: "National Emergency Number", number: "112", icon: "fa-triangle-exclamation" },
                { name: "Police", number: "100", icon: "fa-user-shield" },
                { name: "Fire", number: "101", icon: "fa-fire-extinguisher" },
                { name: "Ambulance", number: "102", icon: "fa-ambulance" },
                { name: "Women's Helpline", number: "1091", icon: "fa-female" }
            ],
            odisha: [
                { name: "State Disaster Management (OSDMA)", number: "1070", icon: "fa-house-tsunami" },
                { name: "SDRF Control Room", number: "0671-2300400", icon: "fa-headset" }
            ],
            uttarakhand: [
                { name: "State Disaster Management (USDMA)", number: "1070", icon: "fa-mountain-city" },
                { name: "District Emergency Center", number: "1077", icon: "fa-building-shield" }
            ],
            kerala: [
                { name: "State Disaster Management (KSDMA)", number: "1079", icon: "fa-water" },
                { name: "District Collectorate Control Room", number: "1077", icon: "fa-house-flood-water" }
            ],
            gujarat: [
                { name: "State Emergency Operation Center", number: "1070", icon: "fa-house-damage" },
                { name: "Earthquake Helpline", number: "1077", icon: "fa-chart-line" }
            ],
            bihar: [
                { name: "State Disaster Management (BSDMA)", number: "1070", icon: "fa-cloud-showers-heavy" },
                { name: "Flood Control Helpline", number: "1077", icon: "fa-water" }
            ],
            maharashtra: [
                { name: "Disaster Management Unit, Mumbai", number: "1916", icon: "fa-city" },
                { name: "State Emergency Operation Center", number: "1070", icon: "fa-house-flood-water" }
            ],
            tamil_nadu: [
                { name: "State Disaster Management (TNSDMA)", number: "1070", icon: "fa-house-tsunami" },
                { name: "Greater Chennai Corporation", number: "1913", icon: "fa-building-columns" }
            ],
            west_bengal: [
                 { name: "State Disaster Management", number: "1070", icon: "fa-cloud-bolt" },
                 { name: "Kolkata Police Disaster Helpline", number: "1073", icon: "fa-person-military-pointing" }
            ],
            assam: [
                { name: "State Disaster Management (ASDMA)", number: "1070", icon: "fa-house-flood-water-circle-arrow-right" },
                { name: "District Emergency Center", number: "1077", icon: "fa-water" }
            ],
            delhi: [
                { name: "Delhi Disaster Management (DDMA)", number: "1077", icon: "fa-building-shield" },
                { name: "Centralized Accident & Trauma", number: "102", icon: "fa-truck-medical" }
            ]
        };

        const regionSelect = document.getElementById('region-select');
        const nationalHelplinesContainer = document.querySelector('#national-helplines .grid');
        const stateHelplinesContainer = document.getElementById('state-helplines');
        const stateTitle = document.getElementById('state-title');
        const stateContactsGrid = document.getElementById('state-contacts-grid');
        const placeholder = document.getElementById('placeholder');
        const placeholderIcon = document.getElementById('placeholder-icon');
        const placeholderText = document.getElementById('placeholder-text');

        function createContactCard(contact) {
            return `
                <div class="contact-card bg-slate-700 p-2 rounded-lg flex items-center gap-2 transition-all duration-300 ease-in-out cursor-pointer">
                    <div class="p-2 bg-slate-900/50 rounded-md">
                        <i class="fas ${contact.icon} text-lg text-emerald-400"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-200 text-xs">${contact.name}</p>
                        <p class="text-blue-400 font-bold text-sm tracking-wider">${contact.number}</p>
                    </div>
                </div>
            `;
        }
        
        function displayNationalContacts() {
            nationalHelplinesContainer.innerHTML = contacts.national.map(createContactCard).join('');
        }

        regionSelect.addEventListener('change', (e) => {
            const selectedRegion = e.target.value;
            const stateName = regionSelect.options[regionSelect.selectedIndex].text.split('(')[0].trim();

            if (selectedRegion === 'none' || selectedRegion === 'national') {
                stateHelplinesContainer.classList.add('hidden');
                placeholder.classList.remove('hidden');
                placeholderIcon.className = 'fas fa-map-marker-alt text-2xl text-slate-500 mb-2';
                placeholderText.textContent = 'Please select a region to view state-specific helplines.';

            } else {
                const stateData = contacts[selectedRegion];
                
                if (stateData) {
                    placeholder.classList.add('hidden');
                    stateTitle.textContent = `${stateName} Helplines`;
                    stateContactsGrid.innerHTML = stateData.map(createContactCard).join('');
                    stateHelplinesContainer.classList.remove('hidden');
                    stateHelplinesContainer.classList.add('fade-in');
                } else {
                    stateHelplinesContainer.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    placeholderIcon.className = 'fas fa-info-circle text-2xl text-slate-500 mb-2';
                    placeholderText.textContent = `Specific helplines for ${stateName} are not listed. Please refer to the National Helplines above.`;
                }
            }
        });

        // Initial load
        window.addEventListener('DOMContentLoaded', () => {
            displayNationalContacts();
        });

    </script>
</body>
</html>
